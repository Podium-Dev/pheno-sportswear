[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "if [ \"$PREVIEW_SERVICE_MODE\" = \"idle\" ]; then node -e \"require('http').createServer((req,res)=>{res.writeHead(200);res.end('OK')}).listen(process.env.PORT||9000)\"; elif [ \"$CHECKOUT_SETUP_MODE\" = \"true\" ]; then (npx medusa user -e \"$MEDUSA_ADMIN_EMAIL\" -p \"$MEDUSA_ADMIN_PASSWORD\" || true); node ../scripts/setup-checkout-preview.mjs; if [ \"$CHECKOUT_SEED_MODE\" = \"true\" ]; then node ../scripts/seed-checkout-preview.mjs; fi; else npm start; fi"
healthcheckPath = "/health"
restartPolicyType = "ALWAYS"
